services:
  - type: web
    name: cadence
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /login
    envVars:
      - key: CADENCE_ENV
        value: production
      - key: CADENCE_ACCOUNTS
        value: "on"
      - key: CADENCE_SIGNUP
        value: "on"
      - key: CADENCE_DATA_DIR
        value: /opt/render/project/src/data
      - key: CADENCE_SECRET_KEY
        generateValue: true
    disk:
      name: cadence-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
